<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Exam Pass Predictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Student Exam Pass Predictor</h2>
    <form id="predictForm">
      <label for="age">Age</label>
      <input type="number" id="age" required>

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label for="course">Course</label>
      <select id="course" required>
        <option value="diploma">Diploma</option>
        <option value="bca">BCA</option>
        <option value="b.sc">B.Sc</option>
      </select>

      <label for="study_hours">Study Hours</label>
      <input type="number" step="0.1" id="study_hours" required>

      <label for="class_attendance">Class Attendance (%)</label>
      <input type="number" step="0.1" id="class_attendance" required>

      <label for="internet_access">Internet Access</label>
      <select id="internet_access" required>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <label for="sleep_hours">Sleep Hours</label>
      <input type="number" step="0.1" id="sleep_hours" required>

      <label for="sleep_quality">Sleep Quality</label>
      <select id="sleep_quality" required>
        <option value="poor">Poor</option>
        <option value="average">Average</option>
        <option value="good">Good</option>
      </select>

      <label for="study_method">Study Method</label>
      <select id="study_method" required>
        <option value="coaching">Coaching</option>
        <option value="online videos">Online Videos</option>
        <option value="self-study">Self-study</option>
      </select>

      <label for="facility_rating">Facility Rating</label>
      <select id="facility_rating" required>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <label for="exam_difficulty">Exam Difficulty</label>
      <select id="exam_difficulty" required>
        <option value="easy">Easy</option>
        <option value="moderate">Moderate</option>
        <option value="hard">Hard</option>
      </select>

      <label for="model">Model</label>
      <select id="model" required>
        <option value="dt">Decision Tree</option>
        <option value="lr">Logistic Regression</option>
      </select>

      <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
